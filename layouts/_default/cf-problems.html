{{- define "title" }}CF Problems - {{ .Site.Title }}{{ end -}}
{{- define "content" }}
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">

  <link rel="stylesheet" href='{{ "css/cf-problems.css" | absURL }}'>
  <script src='https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js'></script>
  <script src='{{ "js/cf-problem.js" | absURL }}?v={{ now.Unix }}'></script>

  <div class='navigator-wrapper'>
  </div>

  <section id="my-set-panel" class="my-set-panel" aria-label="我的题库叠加显示">
    <div class="my-set-heading">
      <div>
        <strong>我的题库</strong>
        <div class="my-set-description">勾选题库后，在下方比赛矩阵中高亮其中的题目。</div>
      </div>
      <a href="/cf-problems/custom/">管理题库 ↗</a>
    </div>
    <div id="my-set-status" class="my-set-status">正在读取登录状态……</div>
    <div id="my-set-options" class="my-set-options"></div>
    <div class="my-set-toolbar">
      <button type="button" id="my-set-select-all">全选</button>
      <button type="button" id="my-set-clear">清空</button>
      <span class="my-set-mode-label">显示方式：</span>
      <button type="button" class="my-set-mode active" data-mode="highlight">高亮模式</button>
      <button type="button" class="my-set-mode" data-mode="filter">仅看所选题目</button>
    </div>
    <div class="my-set-legend"><span class="my-set-swatch"></span> 淡红色表示属于已选题库；AC 状态仍由左侧色条区分。</div>
  </section>

  <div class="main-table-wrapper">
    <div class="btn-group">
      <button type="button" class="btn active">Latest</button>
      <button type="button" class="btn">Div1</button>
      <button type="button" class="btn">Div2</button>
      <button type="button" class="btn">Div3</button>
      <button type="button" class="btn">Div4</button>
      <button type="button" class="btn">Div1 + Div2</button>
      <button type="button" class="btn">Educational</button>
      <button type="button" class="btn">Global</button>
      <button type="button" class="btn">Others</button>
      <button type="button" class="btn">ICPC</button>
    </div>
  </div>

  <div class='main-table-wrapper'>
    <table id='main-table'>
      <thead>
      </thead>

      <tbody>
      </tbody>
    </table>
    <div class="tooltip-inner" style="display: none;"></div>
  </div>

{{ end -}}
